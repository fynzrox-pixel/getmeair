name: Getmeair 0.1.1 Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.1.1'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID || '2040' }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
    steps:
      - name: Checkout Getmeair overlay + server + plugin-host
        uses: actions/checkout@v4

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone Telegram Desktop v7.4.4 (recursive)
        shell: pwsh
        run: |
          git clone --recursive --branch v7.4.4 https://github.com/telegramdesktop/tdesktop.git D:\build\tdesktop
          if ($LASTEXITCODE -ne 0) { throw "clone failed" }

      - name: Skip breakpad stage (ATL not available on runner)
        shell: python
        run: |
          p = "D:/build/tdesktop/Telegram/build/prepare/prepare.py"
          s = open(p).read()
          start = s.find("stage('breakpad'")
          if start == -1:
              print("breakpad stage not found, skipping patch")
          else:
              end = s.find("stage('", start + 1)
              if end == -1:
                  end = len(s)
              s = s[:start] + s[end:]
          s = s.replace("jom -j%NUMBER_OF_PROCESSORS%", "nmake")
          s = s.replace("jom clean", "nmake clean")
          open(p, 'w').write(s)
          print("Patched prepare.py: removed breakpad stage, replaced jom with nmake")

      - name: Apply Getmeair overlay
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\apply_overlay.ps1" -TdesktopRoot D:\build\tdesktop

      - name: Run server tests
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\server"
          node --test 'test/*.test.mjs'

      - name: Run plugin-host tests
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\plugin-host"
          node --test 'test/*.test.mjs'

      - name: Free disk space on runner
        shell: pwsh
        continue-on-error: true
        run: |
          $dirs = @(
            "C:\Program Files (x86)\Android",
            "C:\Program Files\Android",
            "C:\hostedtoolcache\windows\stack",
            "C:\tools",
            "C:\mingw64",
            "C:\vcpkg",
            "C:\cabal",
            "C:\ghcup",
            "C:\Program Files\Haskell",
            "C:\Program Files (x86)\Haskell",
            "C:\SeleniumWebDrivers",
            "C:\Program Files\dotnet",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Program Files (x86)\Microsoft SQL Server",
            "C:\Program Files\MySQL",
            "C:\Program Files\MongoDB",
            "C:\Program Files\R",
            "C:\Program Files\OpenSSL",
            "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI",
            "C:\Program Files\Amazon",
            "C:\Program Files\Microsoft Service Fabric",
            "C:\Program Files\Microsoft SDKs\Service Fabric",
            "C:\Program Files\Microsoft SDKs\Azure",
            "C:\Program Files\LLVM",
            "C:\Program Files (x86)\LLVM",
            "C:\Strawberry",
            "C:\Program Files (x86)\WiX Toolset v3.14",
            "C:\ProgramData\chocolatey",
            "C:\Program Files\nodejs"
          )
          foreach ($d in $dirs) {
            Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
          }
          Get-ChildItem "C:\hostedtoolcache\windows" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike 'Python*' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\hostedtoolcache\windows\Python" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '3.11*' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='FreeGB';E={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize

      - name: Prepare tdesktop dependencies
        shell: pwsh
        run: |
          $bp = "D:\build"
          New-Item -ItemType Directory -Force -Path "$bp\ThirdParty","$bp\Libraries" | Out-Null
          Set-Location "$bp\tdesktop\Telegram\build\prepare"
          & .\win.bat silent

      - name: Configure Telegram (x64)
        shell: pwsh
        run: |
          Set-Location "D:\build\tdesktop\Telegram"
          & .\configure.bat x64 -D "TDESKTOP_API_ID=$env:TDESKTOP_API_ID" -D "TDESKTOP_API_HASH=$env:TDESKTOP_API_HASH"

      - name: Build Release (MSBuild)
        shell: pwsh
        run: |
          $sln = "D:\build\tdesktop\out\Telegram.slnx"
          if (-not (Test-Path $sln)) { $sln = "D:\build\tdesktop\out\Telegram.sln" }
          msbuild $sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Locate and rename binary
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path "D:\build\tdesktop\out" -Recurse -Filter "Telegram.exe" | Select-Object -First 1
          if (-not $bin) { throw "Telegram.exe not found" }
          Copy-Item $bin.FullName "D:\build\Getmeair.exe" -Force
          Write-Output "Built: $($bin.FullName)"

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "D:\build\Getmeair.exe" -DestinationPath "D:\build\Getmeair-Portable.zip" -Force

      - name: Build installer (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $stage = "D:\build\getmeair-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\installer" "$stage\installer" -Recurse -Force
          Copy-Item "$env:GITHUB_WORKSPACE\assets" "$stage\assets" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage\build" | Out-Null
          Copy-Item "D:\build\Getmeair.exe" "$stage\build\Getmeair.exe" -Force
          New-Item -ItemType Directory -Force -Path "$stage\build\modules" | Out-Null
          pwsh -File "$env:GITHUB_WORKSPACE\scripts\build_installer.ps1" -ProjectRoot $stage 2>&1 | Tee-Object -FilePath "$stage\installer-build.log"
          if (Test-Path "$stage\installer\Getmeair Setup.exe") {
            Copy-Item "$stage\installer\Getmeair Setup.exe" "D:\build\Getmeair-Setup-0.1.1.exe" -Force
          }

      - name: Compute SHA-256
        shell: pwsh
        run: |
          "Getmeair.exe: " + (Get-FileHash "D:\build\Getmeair.exe" -Algorithm SHA256).Hash
          "Getmeair-Portable.zip: " + (Get-FileHash "D:\build\Getmeair-Portable.zip" -Algorithm SHA256).Hash
          if (Test-Path "D:\build\Getmeair-Setup-0.1.1.exe") {
            "Getmeair-Setup-0.1.1.exe: " + (Get-FileHash "D:\build\Getmeair-Setup-0.1.1.exe" -Algorithm SHA256).Hash
          }

      - name: Stage artifacts in workspace
        shell: pwsh
        run: |
          $art = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          Copy-Item 'D:\build\Getmeair.exe' $art -Force
          Copy-Item 'D:\build\Getmeair-Portable.zip' $art -Force
          if (Test-Path 'D:\build\Getmeair-Setup-0.1.1.exe') {
            Copy-Item 'D:\build\Getmeair-Setup-0.1.1.exe' $art -Force
          }
          Get-ChildItem $art

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Getmeair-0.1.1-windows-x64
          path: artifacts/
          retention-days: 30